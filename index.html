<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6b5d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Contingência">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>SDE Contingência</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="topo">
  <button id="voltar" class="icone" aria-label="Voltar" hidden>‹</button>
  <div class="titulo"><strong id="titulo">SDE Contingência</strong><span id="subtitulo"></span></div>
  <span id="salvo" aria-live="polite"></span>
</header>
<main id="tela"><p class="vazio">Carregando…</p></main>
<div id="carga" hidden><div class="caixa"><div class="giro"></div><p id="cargaMsg">Aguarde…</p></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="camera" accept="image/*" capture="environment" hidden>
<input type="file" id="importar" accept=".zip,.json,application/zip,application/json" hidden>
<noscript>Este aplicativo precisa de JavaScript ativado.</noscript>
<script src="sde_forms.js"></script>
<script src="app.js"></script>
</body>
</html>
